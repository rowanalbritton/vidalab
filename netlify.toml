[build]
  publish = "site"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/research"
  to = "/research/index.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support/index.html"
  status = 200

# Legacy URL. Kept as a permanent redirect because it has been published
# externally; /privacy is now the single canonical privacy page.
[[redirects]]
  from = "/privacypolicy"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/privacypolicy/*"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/privacy"
  to = "/legal/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/legal/terms.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
