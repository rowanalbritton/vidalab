[build]
  publish = "site"

[[redirects]]
  from = "/"
  to = "/site/index.html"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/site/assets/:splat"
  status = 200

[[redirects]]
  from = "/research"
  to = "/site/research/index.html"
  status = 200

[[redirects]]
  from = "/research/"
  to = "/site/research/index.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/site/app/index.html"
  status = 200

[[redirects]]
  from = "/app/"
  to = "/site/app/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/site/about/index.html"
  status = 200

[[redirects]]
  from = "/about/"
  to = "/site/about/index.html"
  status = 200

[[redirects]]
  from = "/conditions/*"
  to = "/site/conditions/:splat"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/site/legal/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/site/legal/terms.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
