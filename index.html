<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='10' fill='%231e3a2b'/%3E%3Ccircle cx='18' cy='18' r='9' fill='none' stroke='%238fb6ce' stroke-width='1.2' opacity='0.7'/%3E%3Ccircle cx='18' cy='18' r='3.5' fill='%233c6b4f'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>VIDA LAB — Understand what's changing in medicine</title>
    <meta name="description" content="VIDA LAB makes emerging health research easier to understand and connects clear health education with a private wellness app for noticing personal patterns." />
    <link rel="canonical" href="https://vidalab.co/" />
    <meta property="og:title" content="VIDA LAB — Understand what's changing in medicine" />
    <meta property="og:description" content="Clear health research, emerging medicine, and patterns worth noticing." />
    <meta property="og:url" content="https://vidalab.co/" />
    <meta property="og:type" content="website" />
    <style>
      html { background: #F9F8F5; }
      html::before {
        content: "";
        position: fixed;
        top: 50%; left: 50%;
        width: 56px; height: 56px;
        margin: -28px 0 0 -28px;
        border-radius: 50%;
        border: 2px solid #E8E5DF;
        border-top-color: #2E463E;
        border-bottom-color: #3c6b4f;
        animation: _vlab_spin 1.1s linear infinite;
        z-index: 2147483647;
      }
      html::after {
        content: "Loading VIDA LAB";
        position: fixed;
        top: calc(50% + 40px);
        left: 0; right: 0;
        text-align: center;
        font-family: Georgia, serif;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #5a655e;
        z-index: 2147483647;
      }
      @keyframes _vlab_spin { to { transform: rotate(360deg); } }
      html.app-mounted::before, html.app-mounted::after { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Only handle true JS runtime errors — NOT resource loading failures (images, scripts, css)
      // which fire 'error' events with no message and would otherwise blank the page.
      window.addEventListener('error', function(e) {
        // Skip resource loading errors (no message, has target element)
        if (!e.message && (e.target instanceof HTMLElement || e.target instanceof SVGElement)) {
          return;
        }
        console.error('Page error:', e.message, e.filename, e.lineno);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled promise rejection:', e.reason);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Diagnostic: if React hasn't replaced #root's content within 12s, show a message
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          // Hide the CSS-only spinner and "Loading VIDA LAB" text so they don't overlap the fallback
          document.documentElement.classList.add('app-mounted');
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F9F8F5;font-family:Georgia,serif;color:#2E463E;padding:2rem;"><div style="max-width:500px;text-align:center;"><h2 style="font-size:1.5rem;margin-bottom:0.75rem;">Taking a moment to load</h2><p style="color:#5a655e;font-size:0.9rem;margin-bottom:1.5rem;">The app is taking longer than expected. Try reloading.</p><button onclick="location.reload()" style="padding:0.75rem 1.5rem;border-radius:9999px;background:#2E463E;color:#F9F8F5;border:none;font-size:0.875rem;cursor:pointer;">Reload page</button></div></div>';
        }
      }, 12000);
    </script>
  </body>
</html>
